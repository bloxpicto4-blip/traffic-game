<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lightBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />

  <!-- Road Cross Intersection in background -->
  <rect x="206" y="30" width="100" height="452" rx="10" fill="#1e232a" />
  <rect x="30" y="206" width="452" height="100" rx="10" fill="#1e232a" />

  <!-- Road Yellow Medians -->
  <line x1="256" y1="30" x2="256" y2="190" stroke="#f59e0b" stroke-width="4" stroke-dasharray="14 10" />
  <line x1="256" y1="322" x2="256" y2="482" stroke="#f59e0b" stroke-width="4" stroke-dasharray="14 10" />
  <line x1="30" y1="256" x2="190" y2="256" stroke="#f59e0b" stroke-width="4" stroke-dasharray="14 10" />
  <line x1="322" y1="256" x2="482" y2="256" stroke="#f59e0b" stroke-width="4" stroke-dasharray="14 10" />

  <!-- Center Traffic Light Fixture Housing -->
  <rect x="176" y="96" width="160" height="320" rx="36" fill="url(#lightBox)" stroke="#475569" stroke-width="6" />

  <!-- Visor Shields -->
  <path d="M190 144 Q256 120 322 144" stroke="#64748b" stroke-width="6" fill="none" stroke-linecap="round" />
  <path d="M190 256 Q256 232 322 256" stroke="#64748b" stroke-width="6" fill="none" stroke-linecap="round" />
  <path d="M190 368 Q256 344 322 368" stroke="#64748b" stroke-width="6" fill="none" stroke-linecap="round" />

  <!-- Red Lamp -->
  <circle cx="256" cy="160" r="38" fill="#450a0a" stroke="#7f1d1d" stroke-width="3" />
  <circle cx="256" cy="160" r="32" fill="#ef4444" opacity="0.85" />
  <circle cx="246" cy="150" r="8" fill="#ffffff" opacity="0.6" />

  <!-- Yellow Lamp -->
  <circle cx="256" cy="256" r="38" fill="#451a03" stroke="#78350f" stroke-width="3" />
  <circle cx="256" cy="256" r="32" fill="#f59e0b" opacity="0.85" />
  <circle cx="246" cy="246" r="8" fill="#ffffff" opacity="0.6" />

  <!-- Green Lamp (Active Glow) -->
  <circle cx="256" cy="352" r="44" fill="#10b981" opacity="0.25" filter="url(#glowGreen)" />
  <circle cx="256" cy="352" r="38" fill="#064e3b" stroke="#047857" stroke-width="3" />
  <circle cx="256" cy="352" r="34" fill="#10b981" />
  <circle cx="246" cy="342" r="10" fill="#ffffff" opacity="0.8" />
</svg>
